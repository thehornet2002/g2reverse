name: Xray Reverse Bridge (Camouflaged)

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Your Public IP'
        required: true
      target_port:
        description: 'Your Forwarded Port (default 8443)'
        required: true
        default: '8443'
      cert_sha256:
        description: 'Certificate SHA256 (Optional, auto-detected if empty)'
        required: false
      sni:
        description: 'SNI / Host camouflage (default api.github.com)'
        required: false
        default: 'api.github.com'
      path:
        description: 'XHTTP Path (default /api/v3/user/repos)'
        required: false
        default: '/api/v3/user/repos'
      duration:
        description: 'Session Duration (max 6h)'
        required: false
        default: '6h'

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Setup & Run Camouflaged Xray Bridge
        env:
          TARGET_IP: ${{ github.event.inputs.target_ip }}
          TARGET_PORT: ${{ github.event.inputs.target_port }}
          DURATION: ${{ github.event.inputs.duration || '6h' }}
          INPUT_SHA256: ${{ github.event.inputs.cert_sha256 }}
          TARGET_SNI: ${{ github.event.inputs.sni || 'api.github.com' }}
          TARGET_PATH: ${{ github.event.inputs.path || '/api/v3/user/repos' }}
        run: |
          mkdir -p xray
          PIN_SHA256="$INPUT_SHA256"

          # Optimize TCP stack on Linux runner
          sudo sysctl -w net.core.default_qdisc=fq 2>/dev/null || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 2>/dev/null || true

          if [ -z "$PIN_SHA256" ]; then
            echo "Attempting fast certificate fingerprint discovery (max 2s per attempt)..."
            for i in {1..2}; do
              timeout 2 openssl s_client -connect "$TARGET_IP:$TARGET_PORT" -servername "$TARGET_SNI" </dev/null 2>/dev/null | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > xray/peer_cert.pem || true
              if [ -s xray/peer_cert.pem ]; then
                PIN_SHA256=$(openssl x509 -in xray/peer_cert.pem -outform DER 2>/dev/null | sha256sum | awk '{print $1}')
                echo "Discovered pinned certificate SHA256: $PIN_SHA256"
                break
              fi
              sleep 1
            done
          fi

          if [ -n "$PIN_SHA256" ]; then
            PIN_LINE=", \"pinnedPeerCertSha256\": \"$PIN_SHA256\""
          else
            echo "::warning::Could not auto-detect certificate. If handshake fails, provide cert_sha256 in workflow inputs."
            PIN_LINE=""
          fi

          cat <<EOF > xray/config.json
          {
            "log": {
              "loglevel": "warning"
            },
            "policy": {
              "levels": {
                "0": {
                  "handshake": 4,
                  "connIdle": 300,
                  "uplinkOnly": 2,
                  "downlinkOnly": 5,
                  "bufferSize": 16384
                }
              }
            },
            "reverse": {
              "bridges": [
                { "tag": "bridge", "domain": "reverse.local" },
                { "tag": "bridge", "domain": "reverse.local" },
                { "tag": "bridge", "domain": "reverse.local" },
                { "tag": "bridge", "domain": "reverse.local" },
                { "tag": "bridge", "domain": "reverse.local" },
                { "tag": "bridge", "domain": "reverse.local" },
                { "tag": "bridge", "domain": "reverse.local" },
                { "tag": "bridge", "domain": "reverse.local" }
              ]
            },
            "outbounds": [
              {
                "tag": "out-to-internet",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIPv4"
                }
              },
              {
                "tag": "out-to-portal",
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": "$TARGET_IP",
                      "port": $TARGET_PORT,
                      "users": [
                        {
                          "id": "e7b99c43-4dc9-408a-b852-7b5638a16db8",
                          "encryption": "none"
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "xhttp",
                  "security": "tls",
                  "tlsSettings": {
                    "serverName": "$TARGET_SNI"$PIN_LINE
                  },
                  "xhttpSettings": {
                    "path": "$TARGET_PATH",
                    "host": "$TARGET_SNI"
                  }
                }
              }
            ],
            "routing": {
              "rules": [
                {
                  "type": "field",
                  "domain": ["full:reverse.local"],
                  "outboundTag": "out-to-portal"
                },
                {
                  "type": "field",
                  "inboundTag": ["bridge"],
                  "outboundTag": "out-to-internet"
                }
              ]
            }
          }
          EOF

          echo "Downloading Xray v26.3.27 matching client..."
          curl -sL https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o xray.zip
          unzip -q -o xray.zip -d xray-bin
          chmod +x xray-bin/xray

          echo "Starting Bridge towards $TARGET_IP:$TARGET_PORT for duration: $DURATION"
          timeout $DURATION ./xray-bin/xray run -c xray/config.json || true
